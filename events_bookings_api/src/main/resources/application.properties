# Aiven Cloud MySQL Configuration
spring.datasource.url=jdbc:mysql://eventzen-db-eventzen-db.h.aivencloud.com:26244/events_booking_db?sslMode=REQUIRED
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Keep your safe ORM update rule!
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.override-with-generic-response=false

spring.data.redis.url=${REDIS_URL}


# RabbitMQ Configuration
# To connect to a cloud RabbitMQ instance, use a single connection URI.
# It's best practice to externalize this into an environment variable (e.g., RABBITMQ_URL).
spring.rabbitmq.addresses=${RABBITMQ_URL}