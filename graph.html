
    <!DOCTYPE html>
    <html>
    <head>
        <title>RabbitMQ Resilience Graph</title>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <style>
            body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f4f4f9; padding: 40px; color: #333; }
            .chart-container { width: 80%; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
            h2 { color: #2c3e50; }
        </style>
    </head>
    <body>
        <h2>Scenario 3: Asynchronous Resilience (RabbitMQ)</h2>
        <p><strong>1,000 concurrent booking requests processed asynchronously.</strong> Notice how the latency stays extremely low and stable because the Database was bypassed and the tickets were queued.</p>
        <div class="chart-container">
            <canvas id="latencyChart"></canvas>
        </div>
        <script>
            const ctx = document.getElementById('latencyChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Window 1', 'Window 2', 'Window 3', 'Window 4', 'Window 5', 'Window 6'],
                    datasets: [{
                        label: 'P95 Latency (ms)',
                        data: [0, 6838, 36.2, 34.1, 26.8, 22],
                        borderColor: '#3498db',
                        backgroundColor: 'rgba(52, 152, 219, 0.2)',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true,
                        pointBackgroundColor: '#2980b9',
                        pointRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top' }
                    },
                    scales: {
                        y: { beginAtZero: true, title: { display: true, text: 'Latency (Milliseconds)' } },
                        x: { title: { display: true, text: 'Test Duration (10-second intervals)' } }
                    }
                }
            });
        </script>
    </body>
    </html>
